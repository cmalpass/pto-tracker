name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start static app server
        run: |
          python app.py > /tmp/pto-tracker.log 2>&1 &
          echo $! > /tmp/pto-tracker.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/pto-tracker.log
          exit 1
      - run: python tests/test_app.py
