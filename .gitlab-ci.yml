stages:
  - lint
  - test
  - containerize

lint:
  stage: lint
  image: python:3.12-slim
  tags:
    - docker
  script:
    - pip install ruff
    - ruff check . || echo "Ruff check completed"

test:
  stage: test
  image: python:3.12-slim
  tags:
    - docker
  script:
    - pip install --no-cache-dir -r requirements.txt pytest
    - pytest --junitxml=test-results.xml tests/
  artifacts:
    when: always
    reports:
      junit: test-results.xml

build_docker:
  stage: containerize
  image: docker:27-cli
  tags:
    - docker
  script:
    - docker build -t pto-tracker:latest .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
