services:
  pto-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pto-tracker
    ports:
      - "5000:5000"
    volumes:
      - pto-data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/config')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pto-data:
    driver: local
